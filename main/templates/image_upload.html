<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Item Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; }
        input[type="checkbox"] { width: auto; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h1>Add New Item</h1>

{% if message %}<p style="color: green;">{{ message }}</p>{% endif %}

<form method="post" action="{% url 'image_recognition_req' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="id_picture">Picture</label>
    <input type="file" accept="image/png" id="id_picture" name="picture" placeholder="Add the photo of your receipt">

    <button type="submit">Submit Item</button>
</form>
</body>
</html>
